name: Pynguin Test Generator

on:
  issue_comment:
    types: [created]

jobs:
  generate-tests:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@pynguin-test-gen') &&
      (github.event.comment.author_association == 'OWNER' || 
       github.event.comment.author_association == 'COLLABORATOR' || 
       github.event.comment.author_association == 'MEMBER')

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: write
      contents: write
      issues: write

    concurrency:
      group: ${{ github.repository }}-${{ github.event.issue.number }}-testgen
      cancel-in-progress: true

    steps:
      - name: Add reaction to comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: 'rocket'

      # === НОВЫЙ ШАГ: Получаем данные о PR через API ===
      - name: Get PR details
        id: pr_data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Запрашиваем имя ветки HEAD, BASE и имя репозитория отправителя
          json=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName,baseRefName,headRepositoryOwner)
          
          HEAD_REF=$(echo "$json" | jq -r .headRefName)
          BASE_REF=$(echo "$json" | jq -r .baseRefName)
          HEAD_OWNER=$(echo "$json" | jq -r .headRepositoryOwner.login)
          
          echo "head_ref=$HEAD_REF" >> $GITHUB_OUTPUT
          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT
          echo "head_owner=$HEAD_OWNER" >> $GITHUB_OUTPUT
          
          echo "PR Details: Merging $HEAD_REF into $BASE_REF"

      # === ШАГ 2: Checkout с правильными переменными ===
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          # Собираем имя репозитория (важно для форков, но и для одной repo не помешает)
          repository: ${{ steps.pr_data.outputs.head_owner }}/${{ github.event.repository.name }}
          ref: ${{ steps.pr_data.outputs.head_ref }}
          fetch-depth: 0

      # === ШАГ 3: Fetch BASE с правильной переменной ===
      # Нам нужно явно подтянуть origin base ветки, чтобы сравнивать с ней
      - name: Fetch base branch
        run: |
          git fetch origin ${{ steps.pr_data.outputs.base_ref }}:${{ steps.pr_data.outputs.base_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pynguin
          pip install pytest
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # === ШАГ 6 — Find changed .py files ===
      - name: Identify changed Python files
        id: changed-files
        run: |
          # Добавляем | grep -v "tests/" чтобы исключить папку с тестами
          CHANGED_FILES=$(git diff --name-only origin/${{ steps.pr_data.outputs.base_ref }} HEAD -- '*.py' | grep -v "tests/")
          
          CHANGED_FILES_ONE_LINE=$(echo "$CHANGED_FILES" | tr '\n' ' ')
          
          echo "Detected files: $CHANGED_FILES_ONE_LINE"
          
          {
            echo "all_changed_files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # === ШАГ 7 — Run Pynguin с защитой от перезаписи ===
      - name: Generate tests with Pynguin
        env:
          PYNGUIN_DANGER_AWARE: "1"
        run: |
          CHANGED="${{ steps.changed-files.outputs.all_changed_files }}"

          if [ -z "$CHANGED" ]; then
            echo "No Python files changed. Skipping."
            exit 0
          fi

          mkdir -p tests/generated

          echo "$CHANGED" | while read file; do
            [ -z "$file" ] && continue
            if [ ! -f "$file" ]; then continue; fi
            
            # Определяем имя модуля и ожидаемое имя файла теста
            module_name=$(echo "$file" | sed 's/\.py$//' | tr '/' '.')
            # Pynguin по умолчанию создает файлы вида test_module_name.py
            # Если имя модуля code_for_tests, то тест будет test_code_for_tests.py
            # НО Pynguin иногда делает просто test_<имя>.py. 
            # Для надежности зададим output явно, но Pynguin сам именует файлы.
            # Поэтому мы будем искать файл, который Pynguin "собирается" создать.
            
            # В Pynguin имя выходного файла обычно: test_<module_name>.py
            # Поскольку module_name у нас может содержать точки (пакеты), 
            # Pynguin превращает их в подчеркивания или сохраняет структуру.
            # Для упрощения предположим, что файл называется test_<имя_файла>.py
            
            # Логика защиты:
            # Сначала пробуем найти, есть ли уже такой тест.
            # (Здесь небольшая сложность: мы не знаем точно, как Pynguin назовет файл до запуска,
            # но обычно это test_ + имя модуля).
            
            echo "Processing $module_name..."

            # ЗАЩИТА
            # Ищем существующие файлы тестов для этого модуля в папке
            EXISTING_TEST=$(find tests/generated -name "test_*${module_name##*.}.py" | head -n 1)

            if [ -n "$EXISTING_TEST" ]; then
              echo "Found existing test file: $EXISTING_TEST"
              
              # Проверяем заголовок файла (первые 5 строк)
              if grep -q "automatically generated by Pynguin" "$EXISTING_TEST" \
                 || grep -q "Pynguin" "$EXISTING_TEST"; then
                 
                 echo "File was auto-generated. Safe to overwrite."
                 rm "$EXISTING_TEST"
              else
                 echo "WARNING: File $EXISTING_TEST seems to be MANUALLY created."
                 echo "Skipping generation for $module_name to prevent data loss."
                 continue
              fi
            fi

            # Запуск генерации
            echo "Generating tests for module: $module_name"
            
            pynguin \
              --project-path . \
              --output-path tests/generated \
              --module-name "$module_name" \
              --maximum-search-time 60 \
              --maximum-test-execution-timeout 5 || true
              
          done

      # === ШАГ 8: Commit ===
      - name: Commit and push generated tests
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(tests): Add tests generated by Pynguin"
          branch: ${{ steps.pr_data.outputs.head_ref }}
          # repository здесь обычно не нужен, если мы уже сделали checkout нужного репо
          file_pattern: tests/generated/*.py

      # (Шаги 9 и 10 без изменений, только убедитесь, что ref берется из outputs)
      - name: Report success
        if: success()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **Pynguin Test Generation Successful**
            
            Tests have been generated and committed to the branch  
            **${{ steps.pr_data.outputs.head_ref }}**.

      # === ШАГ 10 — Failure message ===
      - name: Report failure
        if: failure()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ **Pynguin Test Generation Failed**
            
            Please check the logs for details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            

      # === ШАГ 11 — Запуск тестов ===
      - name: Run generated tests
        continue-on-error: true
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/generated/ -v