name: LazyTest Generator

on:
  issue_comment:
    types: [created]

jobs:
  generate-tests:
    # Required conditions for security and effectiveness.
    # The process starts only when ALL of the following conditions are met:
    # 1. github.event.issue.pull_request: triggered in a pull request, not in an issue.
    # 2. contains(github.event.comment.body, '@lazytest-gen'): The body contains the trigger.
    # 3. (github.event.comment.author_association == ...): The author is a trusted contributor (owner, collaborator, etc.).
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@lazytest-gen') &&
      (github.event.comment.author_association == 'OWNER' |

| github.event.comment.author_association == 'COLLABORATOR' |
| github.event.comment.author_association == 'MEMBER')

    # Definition of permissions for the built-in GITHUB_TOKEN.
    # Following the principle of least privilege, we provide only the required rights.
    permissions:
      # Required for posting comments and interacting with the pull request API.
      pull-requests: write
      # Required for creating commits and performing git push.
      contents: write

    # Concurrency management. Prevents multiple parallel runs
    # for the same pull request.
    concurrency:
      # The group is unique for each pull request. If a new run starts
      # in the same group while another is active, the previous one is canceled.
      group: ${{ github.repository }}-${{ github.event.issue.number }}-testgen
      cancel-in-progress: true

    runs-on: ubuntu-latest

    # Sequence of steps executed within the job.
    steps:
      # Step 1: User feedback.
      - name: Add reaction to comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: 'rocket'

      # Step 2: Check out PR code.
      - name: Checkout PR Code from Fork
        uses: actions/checkout@v4
        with:
          # Explicitly specify the source repository (may be a fork).
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # Specify the pull request branch.
          ref: ${{ github.event.pull_request.head.ref }}

      # Step 3: Set up Python environment.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 4: Install dependencies from requirements.txt.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pynguin
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Step 5: Determine changed files.
      - name: Identify changed Python files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **.py

      # Step 6: Generate tests using Pynguin.
      - name: Generate tests with Pynguin
        id: pynguin
        run: |
          echo "Changed Python files: ${{ steps.changed-files.outputs.all_changed_files }}"
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            # Convert file path (e.g. src/api/utils.py) into module name (src.api.utils).
            module_name=$(echo "$file" | sed 's/\.py//' | tr '/' '.')
            echo "Generating tests for module: $module_name"
            # Run Pynguin for the specific module.
            pynguin --project-path . --output-path tests/generated --module-name "$module_name"
          done

      # Step 7: Commit and push generated tests.
      - name: Commit and push generated tests
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(tests): Add tests generated by Pynguin"
          # Explicitly specify PR branch to push to.
          branch: ${{ github.event.pull_request.head.ref }}
          # Explicitly specify repository (important for forks).
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # Specify pattern for files to commit.
          file_pattern: 'tests/generated/*.py'

      # Step 8: Success report.
      - name: Report success
        if: success()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **Pynguin Test Generation Successful**

            Tests have been successfully generated and pushed to the branch `${{ github.event.pull_request.head.ref }}`.
            Please review the generated tests before merging.

      # Step 9: Failure report.
      - name: Report failure
        if: failure()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ **Pynguin Test Generation Failed**

            An error occurred during the test generation process.
            Please check the [Actions logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.
