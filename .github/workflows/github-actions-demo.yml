name: Pynguin Test Generator (Full AI)

on:
  issue_comment:
    types: [created]

jobs:
  generate-tests:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@pynguin-test-gen')

    runs-on: ubuntu-latest

    # Права нужны для коммита кода и отправки комментария
    permissions:
      pull-requests: write
      contents: write
      issues: write

    steps:
      # 1. Реакция на комментарий (визуальный фидбек)
      - name: Add reaction
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: 'rocket'

      # 2. Получение информации о ветках через API (так как issue_comment этого не знает)
      - name: Get PR details
        id: pr_data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName,baseRefName,headRepositoryOwner)
          echo "head_ref=$(echo "$json" | jq -r .headRefName)" >> $GITHUB_OUTPUT
          echo "base_ref=$(echo "$json" | jq -r .baseRefName)" >> $GITHUB_OUTPUT
          echo "head_owner=$(echo "$json" | jq -r .headRepositoryOwner.login)" >> $GITHUB_OUTPUT

      # 3. Парсинг аргументов из комментария (например, --maximum-search-time 120)
      - name: Parse arguments
        id: get_args
        shell: python
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          import os, re
          comment = os.environ.get("COMMENT_BODY", "")
          match = re.search(r'@pynguin-test-gen\s+(.*)', comment, re.IGNORECASE)
          user_args = re.sub(r'[^a-zA-Z0-9\-\s\._=]', '', match.group(1).strip()) if match else ""
          user_args = re.sub(r'\s+', ' ', user_args)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"args={user_args}\n")

      # 4. Checkout кода
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr_data.outputs.head_owner }}/${{ github.event.repository.name }}
          ref: ${{ steps.pr_data.outputs.head_ref }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ steps.pr_data.outputs.base_ref }}:${{ steps.pr_data.outputs.base_ref }}

      # 5. Установка зависимостей (включая AI библиотеки)
      - name: Set up Python & Install
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pynguin pytest google-generativeai

      # 6. Поиск измененных файлов (исключая папку tests)
      - name: Identify changed files
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ steps.pr_data.outputs.base_ref }} HEAD -- '*.py' | grep -v "tests/")
          
          # Если изменений нет, выходим рано, но не ломаем пайплайн
          if [ -z "$CHANGED_FILES" ]; then
            echo "No .py files changed."
            echo "all_changed_files=" >> $GITHUB_OUTPUT
          else
            echo "Detected: $CHANGED_FILES"
            # Многострочная запись в output
            echo "all_changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # 7. ГЕНЕРАЦИЯ ТЕСТОВ (Pynguin)
      - name: Generate tests with Pynguin
        timeout-minutes: 3
        env:
          PYNGUIN_DANGER_AWARE: "1"
        run: |
          CHANGED="${{ steps.changed-files.outputs.all_changed_files }}"
          USER_ARGS="${{ steps.get_args.outputs.args }}"
          
          if [ -z "$CHANGED" ]; then exit 0; fi
          mkdir -p tests/generated

          echo "$CHANGED" | while read file; do
            [ -z "$file" ] && continue
            if [ ! -f "$file" ]; then continue; fi
            
            module_name=$(echo "$file" | sed 's/\.py$//' | tr '/' '.')
            
            # Удаляем старый авто-тест перед пересозданием
            find tests/generated -name "test_*${module_name##*.}.py" -delete

            echo "Generating for $module_name with args: $USER_ARGS"
            
            # Запуск Pynguin
            pynguin \
              --project-path . \
              --output-path tests/generated \
              --module-name "$module_name" \
              --algorithm DYNAMOSA \
              --maximum-search-time 60 \
              --maximum-test-execution-timeout 5 \
              $USER_ARGS || true
          done

      # 8. РЕФАКТОРИНГ С GEMINI (ИСПРАВЛЕННЫЙ)
      - name: Refactor tests with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Передаем список файлов прямо в скрипт
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        if: steps.changed-files.outputs.all_changed_files != ''
        run: |
          cat << 'EOF' > ai_refactor.py
          import os
          import google.generativeai as genai
          import time
          import sys

          # 1. Проверка ключа
          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              print("❌ ERROR: GEMINI_API_KEY is missing in Secrets!")
              sys.exit(0) # Не ломаем билд, но выходим

          print("✅ API Key found. Configuring Gemini...")
          genai.configure(api_key=api_key)
          model = genai.GenerativeModel('gemini-1.5-flash')

          # 2. Получаем список измененных файлов из Environment
          changed_files_str = os.environ.get("CHANGED_FILES", "")
          # Разбиваем строку по пробелам или переводам строк
          source_files = changed_files_str.split()

          def refactor(test_path, source_path):
              print(f"🚀 Sending to AI:\n   Source: {source_path}\n   Test: {test_path}")
              
              try:
                  with open(test_path, 'r') as f: test_code = f.read()
                  with open(source_path, 'r') as f: source_code = f.read()
                  
                  prompt = f"""
                  You are a Python QA Expert. Refactor this Pynguin-generated test file.
                  
                  RULES:
                  1. RENAME functions to be descriptive (e.g. 'test_case_0' -> 'test_memory_init').
                  2. ADD docstrings explaining the scenario.
                  3. CLEAN up formatting.
                  4. DO NOT remove the tests, just improve them.
                  5. OUTPUT only raw Python code. No markdown blocks (```).
                  
                  --- SOURCE CODE ({source_path}) ---
                  {source_code}
                  
                  --- TEST CODE TO REFACTOR ---
                  {test_code}
                  """
                  
                  response = model.generate_content(prompt)
                  
                  # Чистим ответ от маркдауна, если ИИ все-таки его добавил
                  new_code = response.text.replace("```python", "").replace("```", "").strip()
                  
                  # Проверка на валидность
                  if "def test" in new_code or "import pytest" in new_code:
                      with open(test_path, 'w') as f: f.write(new_code)
                      print(f"✅ File {test_path} successfully refactored by AI.")
                  else:
                      print(f"⚠️ AI response didn't look like code. Length: {len(new_code)}")
                      print(f"Start of response: {new_code[:100]}")

              except Exception as e:
                  print(f"❌ Gemini API Error: {e}")

          # 3. Основной цикл
          print(f"📂 Processing source files: {source_files}")
          
          for source_file in source_files:
              # Вычисляем имя теста так же, как мы делали это в Bash
              # code_for_tests.py -> tests/generated/test_code_for_tests.py
              
              # Убираем расширение .py
              module_name = source_file.replace(".py", "").replace("/", ".")
              # Поскольку мы не знаем точно, как Pynguin назвал файл (иногда он добавляет пакеты),
              # попробуем найти наиболее вероятного кандидата
              
              # Самый надежный способ: ищем файл, который заканчивается на имя модуля
              # Например, если файл src/utils.py, ищем *utils.py в папке generated
              base_name = os.path.basename(source_file).replace(".py", "")
              
              # Ищем в папке tests/generated файл, содержащий имя исходника
              found_tests = [f for f in os.listdir("tests/generated") if base_name in f and f.startswith("test_")]
              
              if not found_tests:
                  print(f"⚠️ No generated test found for {source_file}. Pynguin skipped it?")
                  continue
                  
              # Берем первый найденный
              test_file_path = os.path.join("tests/generated", found_tests[0])
              
              if os.path.exists(test_file_path):
                  refactor(test_file_path, source_file)
                  time.sleep(2) # Пауза, чтобы не словить Rate Limit (429)
              else:
                  print(f"❌ Test file path error: {test_file_path} does not exist.")

          EOF
          
          python ai_refactor.py
          rm ai_refactor.py

      # 9. ЗАПУСК ТЕСТОВ И СТАТИСТИКА
      - name: Run tests & Collect Stats
        id: run_tests
        continue-on-error: true
        if: steps.changed-files.outputs.all_changed_files != ''
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          
          # Запуск pytest с записью в файл
          pytest tests/generated/ -v | tee result.log
          
          # Парсинг строки "2 failed, 5 passed..."
          SUMMARY=$(grep -oP '(?<== ).*?(?= =)' result.log | tail -1)
          if [ -z "$SUMMARY" ]; then SUMMARY="Tests executed (check logs)"; fi
          
          echo "TEST_SUMMARY=$SUMMARY" >> $GITHUB_OUTPUT
          
          if grep -q "FAILED" result.log; then
             echo "TEST_STATUS=⚠️ Issues Found" >> $GITHUB_OUTPUT
          else
             echo "TEST_STATUS=✅ All Passed" >> $GITHUB_OUTPUT
          fi

      # 10. КОММИТ
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        if: steps.changed-files.outputs.all_changed_files != ''
        with:
          commit_message: "test: AI Generated tests (${{ steps.run_tests.outputs.TEST_SUMMARY }})"
          branch: ${{ steps.pr_data.outputs.head_ref }}
          file_pattern: tests/generated/*.py

      # 11. ОТЧЕТ
      - name: Report results
        if: steps.changed-files.outputs.all_changed_files != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### AI Test Generation Report
            
            **Status:** ${{ steps.run_tests.outputs.TEST_STATUS }}
            **Summary:** `${{ steps.run_tests.outputs.TEST_SUMMARY }}`
            
            * **Generator:** Pynguin (DYNAMOSA)
            * **Refactoring:** Google Gemini AI
            * **Target:** `${{ steps.changed-files.outputs.all_changed_files }}`
            
            Check the committed files in `tests/generated/` for details.