name: Pynguin Test Generator

# 1. Триггер: запуск по созданию комментария
on:
  issue_comment:
    types: [created]

jobs:
  generate-tests:
    # 2. Условие запуска: только для PR и только по команде
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@pynguin-test-gen') &&
      (github.event.comment.author_association == 'OWNER' || 
       github.event.comment.author_association == 'COLLABORATOR' || 
       github.event.comment.author_association == 'MEMBER')

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    concurrency:
      group: ${{ github.repository }}-${{ github.event.issue.number }}-testgen
      cancel-in-progress: true

    steps:
      # === ШАГ 1 — реакция на комментарий ===
      - name: Add reaction to comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: 'rocket'

      # === ШАГ 2 — Checkout HEAD (код PR) ===
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      # === ШАГ 3 — Fetch BASE BRANCH для diff ===
      - name: Fetch base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}:${{ github.event.pull_request.base.ref }}

      # === ШАГ 4 — Set up Python ===
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # === ШАГ 5 — Install dependencies ===
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pynguin
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # === ШАГ 6 — Find changed .py files ===
      - name: Identify changed Python files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          base_ref: ${{ github.event.pull_request.base.ref }}
          head_ref: ${{ github.event.pull_request.head.ref }}
          files: |
            **/*.py

      # === ШАГ 7 — Run Pynguin ===
      - name: Generate tests with Pynguin
        run: |
          echo "Changed .py files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

          CHANGED="${{ steps.changed-files.outputs.all_changed_files }}"

          if [ -z "$CHANGED" ]; then
            echo "No Python files changed. Skipping."
            exit 0
          fi

          mkdir -p tests/generated

          echo "$CHANGED" | while read file; do
            [ -z "$file" ] && continue  
            echo "$file was changed"

            module_name=$(echo "$file" | sed 's/\.py$//' | tr '/' '.')
            echo "Generating tests for module: $module_name"

            pynguin --project-path . --output-path tests/generated --module-name "$module_name"
          done

      # === ШАГ 8 — Commit generated tests ===
      - name: Commit and push generated tests
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(tests): Add tests generated by Pynguin"
          branch: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          file_pattern: tests/generated/*.py

      # === ШАГ 9 — Success message ===
      - name: Report success
        if: success()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **Pynguin Test Generation Successful**
            
            Tests have been generated and committed to the branch  
            **${{ github.event.pull_request.head.ref }}**.

      # === ШАГ 10 — Failure message ===
      - name: Report failure
        if: failure()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ **Pynguin Test Generation Failed**
            
            Please check the logs for details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
