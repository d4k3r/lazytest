name: Pynguin Test Generator

# 1. Триггер: Запуск по созданию комментария
on:
  issue_comment:
    types: [created]

jobs:
  generate-tests:
    # 2. Условия: Запускать только для PR, по триггерной фразе, и только для доверенных пользователей
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@pynguin-test-gen') &&
      (github.event.comment.author_association == 'OWNER' || 
       github.event.comment.author_association == 'COLLABORATOR' || 
       github.event.comment.author_association == 'MEMBER')

    runs-on: ubuntu-latest

    # 3. Безопасность: Принцип наименьших привилегий
    permissions:
      pull-requests: write
      contents: write

    # 4. Надежность: Управление параллелизмом (отмена устаревших запусков)
    concurrency:
      group: ${{ github.repository }}-${{ github.event.issue.number }}-testgen
      cancel-in-progress: true

    steps:
      # 5. Обратная связь (Шаг 1): "Я вас услышал"
      - name: Add reaction to comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: 'rocket'

      # 6. РЕШЕНИЕ ПРОБЛЕМЫ: Извлечение кода из ветки PR (включая форки)
      - name: Checkout PR Code from Fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          # Требуется полная история для git-auto-commit
          fetch-depth: 0

      # 7. Настройка среды Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 8. Установка зависимостей (Pynguin и проекта)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pynguin
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # 9. Оптимизация: Поиск только измененных.py файлов в этом PR
      - name: Identify changed Python files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **.py

      # 10. Основная логика: Запуск Pynguin в цикле для каждого измененного файла
      - name: Generate tests with Pynguin
        id: pynguin

        run: |
          echo "Changed Python files: ${{ steps.changed-files.outputs.all_changed_files }}"
          
          - name: List all changed files
        
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "$file was changed"
          done
          
          # Проверка, есть ли измененные файлы
          if [ -z "${{ steps.changed-files.outputs.all_changed_files }}" ]; then
            echo "No.py files changed in this PR. Skipping test generation."
            exit 0
          fi

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            # Преобразование 'src/api/main.py' в 'src.api.main'
            module_name=$(echo "$file" | sed 's/\.py//' | tr '/' '.')
            echo "Generating tests for module: $module_name"
            

            # Запуск Pynguin
            pynguin --project-path. --output-path tests/generated --module-name "$module_name"
          done

      # 11. Сохранение результатов: Коммит в ветку PR
      - name: Commit and push generated tests
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(tests): Add tests generated by Pynguin"
          branch: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          file_pattern: tests/generated/*.py

      # 12. Обратная связь (Шаг 2 - Успех)
      - name: Report success
        if: success()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **Pynguin Test Generation Successful**
            
            Tests have been successfully generated and pushed to the branch `${{ github.event.pull_request.head.ref }}`.
            
            Please review the generated tests before merging.

      # 13. Обратная связь (Шаг 2 - Провал)
      - name: Report failure
        if: failure()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ **Pynguin Test Generation Failed**
            
            An error occurred during the test generation process. 
            Please check the [Actions logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.