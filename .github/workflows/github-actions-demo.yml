name: Pynguin Test Generator

on:
  issue_comment:
    types: [created]

jobs:
  generate-tests:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@pynguin-test-gen') &&
      (github.event.comment.author_association == 'OWNER' || 
       github.event.comment.author_association == 'COLLABORATOR' || 
       github.event.comment.author_association == 'MEMBER')

    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: write
      contents: write
      issues: write

    concurrency:
      group: ${{ github.repository }}-${{ github.event.issue.number }}-testgen
      cancel-in-progress: true

    steps:
      - name: Add reaction to comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: 'rocket'

      # === НОВЫЙ ШАГ: Получаем данные о PR через API ===
      - name: Get PR details
        id: pr_data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Запрашиваем имя ветки HEAD, BASE и имя репозитория отправителя
          json=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName,baseRefName,headRepositoryOwner)
          
          HEAD_REF=$(echo "$json" | jq -r .headRefName)
          BASE_REF=$(echo "$json" | jq -r .baseRefName)
          HEAD_OWNER=$(echo "$json" | jq -r .headRepositoryOwner.login)
          
          echo "head_ref=$HEAD_REF" >> $GITHUB_OUTPUT
          echo "base_ref=$BASE_REF" >> $GITHUB_OUTPUT
          echo "head_owner=$HEAD_OWNER" >> $GITHUB_OUTPUT
          
          echo "PR Details: Merging $HEAD_REF into $BASE_REF"

      # === ШАГ 2: Checkout с правильными переменными ===
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          # Собираем имя репозитория (важно для форков, но и для одной repo не помешает)
          repository: ${{ steps.pr_data.outputs.head_owner }}/${{ github.event.repository.name }}
          ref: ${{ steps.pr_data.outputs.head_ref }}
          fetch-depth: 0

      # === ШАГ 3: Fetch BASE с правильной переменной ===
      # Нам нужно явно подтянуть origin base ветки, чтобы сравнивать с ней
      - name: Fetch base branch
        run: |
          git fetch origin ${{ steps.pr_data.outputs.base_ref }}:${{ steps.pr_data.outputs.base_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pynguin
          pip install pytest
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # === ШАГ 6: Identify changed files ===
      # Здесь лучше использовать нативный git diff, так как tj-actions может путаться в режиме issue_comment
      # без явного указания sha. Этот способ надежнее для вашей задачи.
      - name: Identify changed Python files
        id: changed-files
        run: |
          # Сравниваем origin/BASE_BRANCH и текущий HEAD
          CHANGED_FILES=$(git diff --name-only origin/${{ steps.pr_data.outputs.base_ref }} HEAD -- '*.py')
          
          # Убираем переносы строк, заменяя их пробелами (для вывода)
          CHANGED_FILES_ONE_LINE=$(echo "$CHANGED_FILES" | tr '\n' ' ')
          
          echo "Detected files: $CHANGED_FILES_ONE_LINE"
          
          # Записываем в output (с поддержкой многострочности для GITHUB_OUTPUT)
          {
            echo "all_changed_files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> $GITHUB_OUTPUT
          
          
          # === НОВЫЙ ШАГ: Парсинг аргументов из комментария ===
          - name: Parse command arguments
            id: get_args
            shell: python
            env:
              COMMENT_BODY: ${{ github.event.comment.body }}
            run: |
              import os
              import re
          
              comment = os.environ.get("COMMENT_BODY", "")
          
              # 1. Ищем строку с командой и всё, что после неё
              # Флаг re.IGNORECASE делает поиск нечувствительным к регистру
              match = re.search(r'@pynguin-test-gen\s+(.*)', comment, re.IGNORECASE)
          
              user_args = ""
              if match:
                  raw_args = match.group(1).strip()
          
                  # 2. ВАЖНО: Санитизация (очистка) ввода
                  # Разрешаем только: буквы, цифры, дефис, пробел, точку, знак равно.
                  # Все остальные символы (например ; | & $) удаляем от греха подальше.
                  user_args = re.sub(r'[^a-zA-Z0-9\-\s\._=]', '', raw_args)
          
                  # Схлопываем множественные пробелы в один
                  user_args = re.sub(r'\s+', ' ', user_args)
          
              print(f"User arguments extracted: '{user_args}'")
          
              # 3. Передаем переменную в GitHub Actions Output
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"args={user_args}\n")
          

      # === ШАГ 7 — Run Pynguin (Обновленный) ===
      - name: Generate tests with Pynguin
        env:
          PYNGUIN_DANGER_AWARE: "1"
        run: |
          CHANGED="${{ steps.changed-files.outputs.all_changed_files }}"
          USER_ARGS="${{ steps.get_args.outputs.args }}" # Получаем аргументы из парсера

          if [ -z "$CHANGED" ]; then
            echo "No Python files changed. Skipping."
            exit 0
          fi

          mkdir -p tests/generated
          
          if [ -n "$USER_ARGS" ]; then
            echo "🔥 Running with custom user arguments: $USER_ARGS"
          fi

          echo "$CHANGED" | while read file; do
            [ -z "$file" ] && continue
            if [ ! -f "$file" ]; then continue; fi
            
            module_name=$(echo "$file" | sed 's/\.py$//' | tr '/' '.')
            
            # --- Блок защиты от перезаписи (который мы обсуждали ранее) ---
            EXISTING_TEST=$(find tests/generated -name "test_*${module_name##*.}.py" | head -n 1)
            if [ -n "$EXISTING_TEST" ]; then
              if ! grep -q "Pynguin" "$EXISTING_TEST"; then
                 echo "⚠ Skipping manual test: $EXISTING_TEST"
                 continue
              else
                 rm "$EXISTING_TEST"
              fi
            fi
            # -------------------------------------------------------------

            echo "Generating tests for module: $module_name"

            # Вставляем $USER_ARGS в конец команды.
            # Если пользователь ничего не ввел, переменная будет пустой и ничего не сломает.
            pynguin \
              --project-path . \
              --output-path tests/generated \
              --module-name "$module_name" \
              --maximum-search-time 60 \
              --maximum-test-execution-timeout 5 \
              $USER_ARGS || true
              
          done

      # === ШАГ 8: Commit ===
      - name: Commit and push generated tests
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat(tests): Add tests generated by Pynguin"
          branch: ${{ steps.pr_data.outputs.head_ref }}
          # repository здесь обычно не нужен, если мы уже сделали checkout нужного репо
          file_pattern: tests/generated/*.py

      # (Шаги 9 и 10 без изменений, только убедитесь, что ref берется из outputs)
      - name: Report success
        if: success()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ✅ **Pynguin Test Generation Successful**
            
            Tests have been generated and committed to the branch  
            **${{ steps.pr_data.outputs.head_ref }}**.

      # === ШАГ 10 — Failure message ===
      - name: Report failure
        if: failure()
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ❌ **Pynguin Test Generation Failed**
            
            Please check the logs for details:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            

      # === ШАГ 11 — Запуск тестов ===
      - name: Run generated tests
        continue-on-error: true
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          pytest tests/generated/ -v