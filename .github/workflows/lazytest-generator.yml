# ==============================================================================
# LazyTest Generator
#
# ChatOps command examples:
#
#   @lazytest-gen
#   @lazytest-gen --generator pynguin
#   @lazytest-gen --generator chatgpt
#   @lazytest-gen --generator gemini
#   @lazytest-gen --generator local-llm
#   @lazytest-gen --generator pynguin-chatgpt
#   @lazytest-gen --generator pynguin-gemini
#   @lazytest-gen --generator pynguin-local-llm
#
# Optional:
#
#   @lazytest-gen --generator pynguin --maximum-search-time 90
#   @lazytest-gen --generator pynguin-gemini --commit-mode all
#   @lazytest-gen --generator local-llm --commit-mode none
#
# Commit modes:
#
#   --commit-mode passing   commit generated tests only if pytest passes
#   --commit-mode all       commit generated tests even if pytest fails
#   --commit-mode none      never commit; only upload artifacts and comment
#
# Required secrets:
#
#   OPENAI_API_KEY          required for chatgpt / pynguin-chatgpt
#   GEMINI_API_KEY          required for gemini / pynguin-gemini
#
# Optional secrets:
#
#   LOCAL_LLM_API_KEY       optional for local OpenAI-compatible endpoints
#
# Optional repository variables:
#
#   OPENAI_MODEL            default: gpt-4o-mini
#   GEMINI_MODEL            default: gemini-2.5-flash
#   LOCAL_LLM_BASE_URL      default: http://127.0.0.1:8000/v1
#   LOCAL_LLM_MODEL         default: local-model
#
# Local LLM modes assume a vLLM/LM Studio/OpenAI-compatible endpoint.
# ==============================================================================

name: LazyTest Generator

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  parse-command:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@lazytest-gen')

    runs-on: ubuntu-latest

    outputs:
      should_run: ${{ steps.parse.outputs.should_run }}
      generator: ${{ steps.parse.outputs.generator }}
      pynguin_args_json: ${{ steps.parse.outputs.pynguin_args_json }}
      commit_mode: ${{ steps.parse.outputs.commit_mode }}
      runner: ${{ steps.parse.outputs.runner }}
      refinement_enabled: ${{ steps.parse.outputs.refinement_enabled }}
      refinement_model: ${{ steps.parse.outputs.refinement_model }}
      parse_warning: ${{ steps.parse.outputs.parse_warning }}
      fallback_warning: ${{ steps.parse.outputs.fallback_warning }}
      ignored_args_json: ${{ steps.parse.outputs.ignored_args_json }}

    steps:
      - name: Parse LazyTest command
        id: parse
        shell: python
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          import json
          import os
          import re
          import shlex

          comment = os.environ.get("COMMENT_BODY", "")

          def write_output(name: str, value: str) -> None:
              value = str(value)
              value = value.replace("\n", " ").replace("\r", " ")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"{name}={value}\n")

          # Require the command to be a standalone line.
          # This prevents accidental triggering from quoted text, examples, or prose.
          match = re.search(
              r"(?im)^\s*@lazytest-gen(?:\s+(.*))?\s*$",
              comment,
          )

          if not match:
              write_output("should_run", "false")
              write_output("generator", "pynguin")
              write_output("pynguin_args_json", "[]")
              write_output("commit_mode", "passing")
              write_output("runner", "ubuntu-latest")
              write_output("refinement_enabled", "false")
              write_output("refinement_model", "none")
              write_output("parse_warning", "none")
              write_output("fallback_warning", "none")
              write_output("ignored_args_json", "[]")
              raise SystemExit(0)

          raw_args = (match.group(1) or "").strip()
          parse_warning = "none"

          try:
              tokens = shlex.split(raw_args)
          except ValueError as exc:
              tokens = raw_args.split()
              parse_warning = (
                  f"Malformed quoted command arguments; used whitespace fallback. "
                  f"shlex.split error: {exc}"
              )

          allowed_generators = {
              "pynguin",
              "chatgpt",
              "gemini",
              "pynguin-chatgpt",
              "pynguin-gemini",
              "local-llm",
              "pynguin-local-llm",
          }

          hybrid_modes = {
              "pynguin-chatgpt": "chatgpt",
              "pynguin-gemini": "gemini",
              "pynguin-local-llm": "local-llm",
          }

          local_modes = {
              "local-llm",
              "pynguin-local-llm",
          }

          # Only allow a controlled subset of Pynguin arguments to be passed
          # from a PR comment. This avoids arbitrary user-controlled CLI input.
          pynguin_args_with_values = {
              "--algorithm",
              "--maximum-search-time",
              "--maximum-test-execution-timeout",
              "--maximum-iterations",
              "--seed",
              "--assertion-generation",
              "--population",
          }

          pynguin_boolean_args = {
              "-v",
          }

          generator = "pynguin"
          commit_mode = "passing"
          pynguin_args = []
          ignored_args = []
          fallback_warnings = []

          i = 0
          while i < len(tokens):
              token = tokens[i]

              if token == "--generator":
                  if i + 1 >= len(tokens):
                      fallback_warnings.append(
                          "Missing value after --generator; falling back to pynguin."
                      )
                      generator = "pynguin"
                      ignored_args.append(token)
                      i += 1
                      continue

                  candidate = tokens[i + 1].lower()

                  if candidate in allowed_generators:
                      generator = candidate
                  else:
                      fallback_warnings.append(
                          f"Unknown generator '{candidate}' supplied; falling back to pynguin."
                      )
                      generator = "pynguin"
                      ignored_args.extend([token, tokens[i + 1]])

                  i += 2
                  continue

              if token.startswith("--generator="):
                  candidate = token.split("=", 1)[1].lower()

                  if candidate in allowed_generators:
                      generator = candidate
                  else:
                      fallback_warnings.append(
                          f"Unknown generator '{candidate}' supplied; falling back to pynguin."
                      )
                      generator = "pynguin"
                      ignored_args.append(token)

                  i += 1
                  continue

              if token == "--commit-mode":
                  if i + 1 >= len(tokens):
                      ignored_args.append(token)
                      i += 1
                      continue

                  candidate = tokens[i + 1].lower()

                  if candidate in {"passing", "all", "none"}:
                      commit_mode = candidate
                  else:
                      ignored_args.extend([token, tokens[i + 1]])

                  i += 2
                  continue

              if token.startswith("--commit-mode="):
                  candidate = token.split("=", 1)[1].lower()

                  if candidate in {"passing", "all", "none"}:
                      commit_mode = candidate
                  else:
                      ignored_args.append(token)

                  i += 1
                  continue

              if token in pynguin_boolean_args:
                  pynguin_args.append(token)
                  i += 1
                  continue

              if token in pynguin_args_with_values:
                  if i + 1 >= len(tokens):
                      ignored_args.append(token)
                      i += 1
                      continue

                  pynguin_args.extend([token, tokens[i + 1]])
                  i += 2
                  continue

              matched_key_value_arg = False

              for allowed in pynguin_args_with_values:
                  prefix = allowed + "="

                  if token.startswith(prefix):
                      pynguin_args.append(token)
                      matched_key_value_arg = True
                      break

              if matched_key_value_arg:
                  i += 1
                  continue

              ignored_args.append(token)
              i += 1

          runner = "self-hosted" if generator in local_modes else "ubuntu-latest"
          refinement_enabled = "true" if generator in hybrid_modes else "false"
          refinement_model = hybrid_modes.get(generator, "none")
          fallback_warning = "; ".join(fallback_warnings) if fallback_warnings else "none"

          write_output("should_run", "true")
          write_output("generator", generator)
          write_output("pynguin_args_json", json.dumps(pynguin_args))
          write_output("commit_mode", commit_mode)
          write_output("runner", runner)
          write_output("refinement_enabled", refinement_enabled)
          write_output("refinement_model", refinement_model)
          write_output("parse_warning", parse_warning)
          write_output("fallback_warning", fallback_warning)
          write_output("ignored_args_json", json.dumps(ignored_args))

          print(f"Command: @lazytest-gen")
          print(f"Generator: {generator}")
          print(f"Runner: {runner}")
          print(f"Commit mode: {commit_mode}")
          print(f"Refinement enabled: {refinement_enabled}")
          print(f"Refinement model: {refinement_model}")
          print(f"Pynguin passthrough args: {pynguin_args}")
          print(f"Ignored unsafe/unknown args: {ignored_args}")
          print(f"Parse warning: {parse_warning}")
          print(f"Fallback warning: {fallback_warning}")

  preflight:
    needs: parse-command

    if: ${{ needs.parse-command.outputs.should_run == 'true' }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: read

    outputs:
      can_run: ${{ steps.safety.outputs.can_run }}
      authorised: ${{ steps.safety.outputs.authorised }}
      same_repo: ${{ steps.safety.outputs.same_repo }}
      rejection_reason: ${{ steps.safety.outputs.rejection_reason }}

      head_ref: ${{ steps.pr_data.outputs.head_ref }}
      head_sha: ${{ steps.pr_data.outputs.head_sha }}
      head_repo: ${{ steps.pr_data.outputs.head_repo }}
      head_owner: ${{ steps.pr_data.outputs.head_owner }}
      base_ref: ${{ steps.pr_data.outputs.base_ref }}
      base_sha: ${{ steps.pr_data.outputs.base_sha }}
      base_repo: ${{ steps.pr_data.outputs.base_repo }}

    steps:
      - name: Read PR metadata
        id: pr_data
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          import json
          import os
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]

          url = f"https://api.github.com/repos/{repo}/pulls/{pr_number}"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              pr = json.loads(response.read().decode("utf-8"))

          outputs = {
              "head_ref": pr["head"]["ref"],
              "head_sha": pr["head"]["sha"],
              "head_repo": pr["head"]["repo"]["full_name"],
              "head_owner": pr["head"]["repo"]["owner"]["login"],
              "base_ref": pr["base"]["ref"],
              "base_sha": pr["base"]["sha"],
              "base_repo": pr["base"]["repo"]["full_name"],
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              for key, value in outputs.items():
                  f.write(f"{key}={value}\n")

          print(json.dumps(outputs, indent=2))

      - name: Evaluate authorisation and PR trust boundary
        id: safety
        shell: python
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          HEAD_REPO: ${{ steps.pr_data.outputs.head_repo }}
          CURRENT_REPO: ${{ github.repository }}
        run: |
          import os

          author_association = os.environ.get("AUTHOR_ASSOCIATION", "")
          head_repo = os.environ.get("HEAD_REPO", "")
          current_repo = os.environ.get("CURRENT_REPO", "")

          authorised_roles = {"OWNER", "MEMBER", "COLLABORATOR"}

          authorised = author_association in authorised_roles
          same_repo = head_repo == current_repo
          can_run = authorised and same_repo

          if not authorised:
              rejection_reason = (
                  f"unauthorised author_association: {author_association}"
              )
          elif not same_repo:
              rejection_reason = (
                  f"forked PR refused: head_repo={head_repo}, current_repo={current_repo}"
              )
          else:
              rejection_reason = "none"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"authorised={'true' if authorised else 'false'}\n")
              f.write(f"same_repo={'true' if same_repo else 'false'}\n")
              f.write(f"can_run={'true' if can_run else 'false'}\n")
              f.write(f"rejection_reason={rejection_reason}\n")

          print(f"authorised={authorised}")
          print(f"same_repo={same_repo}")
          print(f"can_run={can_run}")
          print(f"rejection_reason={rejection_reason}")

      - name: Report unauthorised command use
        if: steps.safety.outputs.authorised == 'false'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### LazyTest Generator did not run

            The `@lazytest-gen` command can only be used by repository `OWNER`, `MEMBER`, or `COLLABORATOR` users.

            Detected `author_association`: `${{ github.event.comment.author_association }}`.

      - name: Report forked PR refusal
        if: steps.safety.outputs.authorised == 'true' && steps.safety.outputs.same_repo == 'false'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### LazyTest Generator did not run

            This workflow is restricted to pull requests from branches in the same repository.

            Reason: LazyTest validates generated tests by executing `pull_request` code. Running untrusted fork code with write permissions, secrets, or a `self-hosted` runner is unsafe.

      - name: Add accepted-command reaction
        if: steps.safety.outputs.can_run == 'true'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: rocket

  generate-tests:
    needs:
      - parse-command
      - preflight

    if: ${{ needs.preflight.outputs.can_run == 'true' }}

    runs-on: ${{ needs.parse-command.outputs.runner }}

    permissions:
      contents: read
      pull-requests: read

    outputs:
      has_changed_files: ${{ steps.changed_files.outputs.has_changed_files }}
      all_changed_files: ${{ steps.changed_files.outputs.all_changed_files }}
      generated_count: ${{ steps.generate.outputs.generated_count }}
      successful_count: ${{ steps.generate.outputs.successful_count }}
      test_containing_count: ${{ steps.generate.outputs.test_containing_count }}
      test_status: ${{ steps.run_tests.outputs.test_status }}
      test_passed: ${{ steps.run_tests.outputs.test_passed }}
      test_exit_code: ${{ steps.run_tests.outputs.test_exit_code }}
      test_summary: ${{ steps.run_tests.outputs.test_summary }}

    steps:

      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ needs.preflight.outputs.head_repo }}
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch base branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ needs.preflight.outputs.base_ref }}:refs/remotes/origin/${{ needs.preflight.outputs.base_ref }}"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install LazyTest dependencies
        shell: bash
        env:
          GENERATOR: ${{ needs.parse-command.outputs.generator }}
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install -r requirements/workflow.txt

      - name: Install target project dependencies
        shell: bash
        run: |
          set -euo pipefail

          # Best-effort installation of the target repository.
          # This improves import compatibility but is not a sandboxing mechanism.
          # Forked PRs are refused in the preflight job before checkout/execution.

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt || \
              echo "::warning::requirements.txt installation failed; continuing"
          fi

          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            python -m pip install -e . || \
              echo "::warning::Editable installation failed; continuing"
          fi

      - name: Identify changed Python files
        id: changed_files
        shell: bash
        run: |
          set -euo pipefail

          BASE_REF="origin/${{ needs.preflight.outputs.base_ref }}"

          git diff --name-only --diff-filter=AM "$BASE_REF"...HEAD -- '*.py' > changed_candidates.txt || true

          python - <<'PY'
          from pathlib import Path

          candidates_path = Path("changed_candidates.txt")
          output_path = Path("changed_files.txt")

          excluded_dir_names = {"test", "tests", "testing"}

          selected = []

          for raw in candidates_path.read_text(encoding="utf-8").splitlines():
              path_str = raw.strip()

              if not path_str:
                  continue

              path = Path(path_str)
              parts_lower = {part.lower() for part in path.parts}
              name_lower = path.name.lower()

              if parts_lower & excluded_dir_names:
                  continue

              if name_lower == "conftest.py":
                  continue

              if name_lower.startswith("test_"):
                  continue

              if name_lower.endswith("_test.py"):
                  continue

              selected.append(path_str)

          output_path.write_text(
              "\n".join(selected) + ("\n" if selected else ""),
              encoding="utf-8",
          )

          print("Changed non-test Python files:")

          for item in selected:
              print(f"  {item}")
          PY

          if [ ! -s changed_files.txt ]; then
            echo "No changed non-test Python files."
            echo "has_changed_files=false" >> "$GITHUB_OUTPUT"
            echo "all_changed_files=" >> "$GITHUB_OUTPUT"
          else
            echo "has_changed_files=true" >> "$GITHUB_OUTPUT"
            echo "all_changed_files<<EOF" >> "$GITHUB_OUTPUT"
            cat changed_files.txt >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create evaluation manifest
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import ast
          import csv
          import json
          from pathlib import Path
          from typing import Any

          candidates_path = Path("changed_candidates.txt")
          included_path = Path("changed_files.txt")

          candidates = (
              candidates_path.read_text(encoding="utf-8").splitlines()
              if candidates_path.exists()
              else []
          )

          included = set(
              line.strip()
              for line in included_path.read_text(encoding="utf-8").splitlines()
              if line.strip()
          ) if included_path.exists() else set()

          excluded_dir_names = {"test", "tests", "testing"}

          def exclusion_reason(path_str: str) -> str:
              path = Path(path_str)
              parts_lower = {part.lower() for part in path.parts}
              name_lower = path.name.lower()

              if path_str in included:
                  return "included_source_file"

              if parts_lower & excluded_dir_names:
                  return "test_directory"

              if name_lower == "conftest.py":
                  return "conftest_file"

              if name_lower.startswith("test_"):
                  return "test_file_prefix"

              if name_lower.endswith("_test.py"):
                  return "test_file_suffix"

              return "filtered_out"

          def analyse_file(path_str: str) -> dict[str, Any]:
              path = Path(path_str)

              row: dict[str, Any] = {
                  "source_file": path_str,
                  "included_or_excluded": "included" if path_str in included else "excluded",
                  "reason": exclusion_reason(path_str),
                  "function_count": 0,
                  "class_count": 0,
                  "has_docstrings": False,
                  "loc": 0,
                  "mutation_evaluated": False,
              }

              if not path.exists():
                  row["reason"] = "file_missing"
                  return row

              text = path.read_text(encoding="utf-8", errors="replace")
              row["loc"] = sum(1 for line in text.splitlines() if line.strip())

              try:
                  tree = ast.parse(text)
              except SyntaxError:
                  row["reason"] = "syntax_error_in_source"
                  return row

              functions = [
                  node for node in ast.walk(tree)
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              ]
              classes = [
                  node for node in ast.walk(tree)
                  if isinstance(node, ast.ClassDef)
              ]

              row["function_count"] = len(functions)
              row["class_count"] = len(classes)

              has_module_docstring = ast.get_docstring(tree) is not None
              has_function_docstring = any(ast.get_docstring(node) for node in functions)
              has_class_docstring = any(ast.get_docstring(node) for node in classes)

              row["has_docstrings"] = bool(
                  has_module_docstring or has_function_docstring or has_class_docstring
              )

              return row

          rows = [analyse_file(path.strip()) for path in candidates if path.strip()]

          fieldnames = [
              "source_file",
              "included_or_excluded",
              "reason",
              "function_count",
              "class_count",
              "has_docstrings",
              "loc",
              "mutation_evaluated",
          ]

          with open("evaluation_manifest.csv", "w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          Path("evaluation_manifest.json").write_text(
              json.dumps(rows, indent=2),
              encoding="utf-8",
          )

          print(json.dumps(rows, indent=2))
          PY

      - name: Create reproducibility metadata
        if: always()
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.issue.number }}

          GENERATOR: ${{ needs.parse-command.outputs.generator }}
          PYNGUIN_ARGS_JSON: ${{ needs.parse-command.outputs.pynguin_args_json }}
          COMMIT_MODE: ${{ needs.parse-command.outputs.commit_mode }}
          RUNNER_KIND: ${{ needs.parse-command.outputs.runner }}
          REFINEMENT_ENABLED: ${{ needs.parse-command.outputs.refinement_enabled }}
          REFINEMENT_MODEL: ${{ needs.parse-command.outputs.refinement_model }}

          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          LOCAL_LLM_BASE_URL: ${{ vars.LOCAL_LLM_BASE_URL }}
          LOCAL_LLM_MODEL: ${{ vars.LOCAL_LLM_MODEL }}

          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          HEAD_REF: ${{ needs.preflight.outputs.head_ref }}
          BASE_REF: ${{ needs.preflight.outputs.base_ref }}

          PROMPT_VARIANT: github-actions-basic
          RETRY_BUDGET: "0"
          GENERATION_TIMEOUT_MINUTES: "45"
          PYTEST_TIMEOUT_MINUTES: "20"
          PYTEST_PER_TEST_TIMEOUT_SECONDS: "15"

          LLM_TEMPERATURE: "0"
          LLM_TOP_P: provider_default
          LLM_TOP_K: not_applicable_or_provider_default
          LLM_MIN_P: not_applicable_or_provider_default
          LLM_MAX_TOKENS: provider_default
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import platform
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          def run_command(command: list[str]) -> str:
              try:
                  return subprocess.check_output(
                      command,
                      text=True,
                      stderr=subprocess.STDOUT,
                  ).strip()
              except Exception as exc:
                  return f"unavailable: {exc}"

          def optional_command(command: list[str]) -> str:
              try:
                  return subprocess.check_output(
                      command,
                      text=True,
                      stderr=subprocess.STDOUT,
                      timeout=20,
                  ).strip()
              except Exception:
                  return "unavailable"

          metadata = {
              "run_timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "actor": os.environ.get("GITHUB_ACTOR"),
              "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "pull_request_number": os.environ.get("PR_NUMBER"),
              "commit_hash": run_command(["git", "rev-parse", "HEAD"]),
              "head_sha": os.environ.get("HEAD_SHA"),
              "base_sha": os.environ.get("BASE_SHA"),
              "head_ref": os.environ.get("HEAD_REF"),
              "base_ref": os.environ.get("BASE_REF"),
              "generator": os.environ.get("GENERATOR"),
              "pynguin_args_json": os.environ.get("PYNGUIN_ARGS_JSON"),
              "commit_mode": os.environ.get("COMMIT_MODE"),
              "runner_kind": os.environ.get("RUNNER_KIND"),
              "refinement_enabled": os.environ.get("REFINEMENT_ENABLED"),
              "refinement_model": os.environ.get("REFINEMENT_MODEL"),
              "models": {
                  "openai_model": os.environ.get("OPENAI_MODEL") or "gpt-4o-mini",
                  "gemini_model": os.environ.get("GEMINI_MODEL") or "gemini-2.5-flash",
                  "local_llm_model": os.environ.get("LOCAL_LLM_MODEL") or "local-model",
                  "local_llm_base_url": os.environ.get("LOCAL_LLM_BASE_URL") or "http://127.0.0.1:8000/v1",
              },
              "generation_parameters": {
                  "temperature": os.environ.get("LLM_TEMPERATURE"),
                  "top_p": os.environ.get("LLM_TOP_P"),
                  "top_k": os.environ.get("LLM_TOP_K"),
                  "min_p": os.environ.get("LLM_MIN_P"),
                  "max_tokens": os.environ.get("LLM_MAX_TOKENS"),
              },
              "prompt_variant": os.environ.get("PROMPT_VARIANT"),
              "retry_budget": os.environ.get("RETRY_BUDGET"),
              "timeout_settings": {
                  "generation_timeout_minutes": os.environ.get("GENERATION_TIMEOUT_MINUTES"),
                  "pytest_timeout_minutes": os.environ.get("PYTEST_TIMEOUT_MINUTES"),
                  "pytest_per_test_timeout_seconds": os.environ.get("PYTEST_PER_TEST_TIMEOUT_SECONDS"),
                  "pynguin_subprocess_timeout_seconds": 900,
                  "pynguin_default_maximum_search_time_seconds": 60,
                  "pynguin_default_maximum_test_execution_timeout_seconds": 5,
                  "pynguin_user_passthrough_args_json": os.environ.get("PYNGUIN_ARGS_JSON"),
              },
              "environment": {
                  "python_version": sys.version,
                  "platform": platform.platform(),
                  "machine": platform.machine(),
                  "processor": platform.processor(),
                  "runner_os": os.environ.get("RUNNER_OS"),
                  "runner_arch": os.environ.get("RUNNER_ARCH"),
                  "gpu": optional_command([
                      "nvidia-smi",
                      "--query-gpu=name,memory.total,driver_version",
                      "--format=csv,noheader",
                  ]),
              },
              "package_versions": run_command([sys.executable, "-m", "pip", "freeze"]).splitlines(),
          }

          Path("run_metadata.json").write_text(
              json.dumps(metadata, indent=2),
              encoding="utf-8",
          )

          print(json.dumps(metadata, indent=2))
          PY

      - name: Generate and optionally refine tests
        id: generate
        if: steps.changed_files.outputs.has_changed_files == 'true'
        timeout-minutes: 45
        shell: bash
        env:
          GENERATOR: ${{ needs.parse-command.outputs.generator }}
          PYNGUIN_ARGS_JSON: ${{ needs.parse-command.outputs.pynguin_args_json }}

          OPENAI_API_KEY: ${{ (needs.parse-command.outputs.generator == 'chatgpt' || needs.parse-command.outputs.generator == 'pynguin-chatgpt') && secrets.OPENAI_API_KEY || '' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}

          GEMINI_API_KEY: ${{ (needs.parse-command.outputs.generator == 'gemini' || needs.parse-command.outputs.generator == 'pynguin-gemini') && secrets.GEMINI_API_KEY || '' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}

          LOCAL_LLM_BASE_URL: ${{ vars.LOCAL_LLM_BASE_URL }}
          LOCAL_LLM_MODEL: ${{ vars.LOCAL_LLM_MODEL }}
          LOCAL_LLM_API_KEY: ${{ (needs.parse-command.outputs.generator == 'local-llm' || needs.parse-command.outputs.generator == 'pynguin-local-llm') && secrets.LOCAL_LLM_API_KEY || '' }}
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path
          from typing import Any

          ROOT = Path.cwd()
          OUT_DIR = ROOT / "tests" / "generated"
          OUT_DIR.mkdir(parents=True, exist_ok=True)

          GENERATOR = os.environ.get("GENERATOR", "pynguin").strip().lower()
          PYNGUIN_ARGS = json.loads(os.environ.get("PYNGUIN_ARGS_JSON", "[]"))

          DIRECT_LLM_MODES = {
              "chatgpt": "chatgpt",
              "gemini": "gemini",
              "local-llm": "local-llm",
          }

          HYBRID_MODES = {
              "pynguin-chatgpt": "chatgpt",
              "pynguin-gemini": "gemini",
              "pynguin-local-llm": "local-llm",
          }

          changed_files = [
              line.strip()
              for line in Path("changed_files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          manifest: dict[str, Any] = {
              "command": "@lazytest-gen",
              "generator": GENERATOR,
              "pynguin_args": PYNGUIN_ARGS,
              "results": [],
          }

          def rel(path: Path) -> str:
              return path.relative_to(ROOT).as_posix()

          def module_name_from_path(source_file: str) -> str:
              return source_file[:-3].replace("/", ".").replace("\\", ".")

          def safe_test_path(source_file: str) -> Path:
              without_suffix = source_file[:-3]
              safe = re.sub(r"[^A-Za-z0-9_]+", "_", without_suffix).strip("_")
              digest = hashlib.sha1(source_file.encode("utf-8")).hexdigest()[:8]
              return OUT_DIR / f"test_{safe}_{digest}.py"

          def clean_llm_output(text: str) -> str:
              text = (text or "").strip()

              fenced = re.search(
                  r"```(?:python|py)?\s*(.*?)```",
                  text,
                  flags=re.IGNORECASE | re.DOTALL,
              )

              if fenced:
                  text = fenced.group(1).strip()

              lowered = text.lower()

              for marker in ("import ", "from ", "def test_", "class Test"):
                  index = lowered.find(marker.lower())

                  if index > 0:
                      text = text[index:].strip()
                      break

              return text.rstrip() + "\n"

          def count_tests(code: str) -> int:
              return len(re.findall(r"(?m)^\s*def\s+test_", code))

          def compile_status(code: str, path: Path) -> tuple[bool, str]:
              try:
                  compile(code, str(path), "exec")
                  return True, ""
              except SyntaxError as exc:
                  return False, f"{exc.__class__.__name__}: {exc}"

          def record_result(
              *,
              source_file: str,
              test_file: str | None,
              status: str,
              syntax_valid: bool,
              elapsed_s: float,
              n_tests: int = 0,
              notes: str = "",
              refinement_model: str = "",
          ) -> None:
              manifest["results"].append(
                  {
                      "source_file": source_file,
                      "test_file": test_file,
                      "status": status,
                      "syntax_valid": syntax_valid,
                      "elapsed_s": round(elapsed_s, 3),
                      "n_tests": n_tests,
                      "refinement_model": refinement_model,
                      "notes": notes,
                  }
              )

          def build_direct_generation_prompt(source_file: str, source_code: str) -> str:
              module_name = module_name_from_path(source_file)

              return f"""
          You are generating pytest unit tests for a Python pull request.

          Output rules:
          - Output raw Python code only.
          - Do not use markdown fences.
          - Do not explain your answer.
          - Do not reimplement source functions or classes.
          - Prefer deterministic tests.
          - Use pytest.
          - Mock filesystem, network, randomness, stdin/stdout, time, and external services where necessary.
          - The module under test is importable as: {module_name}
          - Prefer this import style:

          import importlib
          target_module = importlib.import_module("{module_name}")

          Then call functions and classes as target_module.<name>.

          Source file path:
          {source_file}

          Source code:
          {source_code}
          """.strip()

          def build_refinement_prompt(
              *,
              source_file: str,
              source_code: str,
              test_file: str,
              test_code: str,
          ) -> str:
              module_name = module_name_from_path(source_file)

              return f"""
          You are refining automatically generated pytest tests.

          The tests were initially generated by Pynguin. Improve them without changing the intended target module.

          Output rules:
          - Output raw Python code only.
          - Do not use markdown fences.
          - Do not explain your answer.
          - Do not reimplement source functions or classes.
          - Keep useful existing test scenarios.
          - Remove only duplicated, meaningless, or clearly invalid tests.
          - Improve readability and function names.
          - Add short docstrings only where they clarify the test scenario.
          - Fix obvious import mistakes if needed.
          - The module under test is importable as: {module_name}
          - Prefer this import style if imports need to be rewritten:

          import importlib
          target_module = importlib.import_module("{module_name}")

          Then call functions and classes as target_module.<name>.

          Source file path:
          {source_file}

          Source code:
          {source_code}

          Generated test file path:
          {test_file}

          Generated test code:
          {test_code}
          """.strip()

          def call_llm(model_kind: str, prompt: str) -> str:
              if model_kind == "chatgpt":
                  api_key = os.environ.get("OPENAI_API_KEY")

                  if not api_key:
                      raise RuntimeError("OPENAI_API_KEY is missing")

                  from openai import OpenAI

                  model_name = os.environ.get("OPENAI_MODEL") or "gpt-4o-mini"

                  client = OpenAI(
                      api_key=api_key,
                      timeout=900.0,
                  )

                  response = client.chat.completions.create(
                      model=model_name,
                      messages=[
                          {
                              "role": "system",
                              "content": "You generate only raw, valid pytest code.",
                          },
                          {
                              "role": "user",
                              "content": prompt,
                          },
                      ],
                      temperature=0,
                  )

                  return response.choices[0].message.content or ""

              if model_kind == "gemini":
                  api_key = os.environ.get("GEMINI_API_KEY")

                  if not api_key:
                      raise RuntimeError("GEMINI_API_KEY is missing")

                  import google.generativeai as genai

                  model_name = os.environ.get("GEMINI_MODEL") or "gemini-2.5-flash"

                  genai.configure(api_key=api_key)
                  model = genai.GenerativeModel(model_name)

                  response = model.generate_content(prompt)
                  return getattr(response, "text", "") or ""

              if model_kind == "local-llm":
                  from openai import OpenAI

                  base_url = os.environ.get("LOCAL_LLM_BASE_URL") or "http://127.0.0.1:8000/v1"
                  model_name = os.environ.get("LOCAL_LLM_MODEL") or "local-model"
                  api_key = os.environ.get("LOCAL_LLM_API_KEY") or "not-needed"

                  client = OpenAI(
                      base_url=base_url,
                      api_key=api_key,
                      timeout=900.0,
                  )

                  response = client.chat.completions.create(
                      model=model_name,
                      messages=[
                          {
                              "role": "system",
                              "content": "You generate only raw, valid pytest code.",
                          },
                          {
                              "role": "user",
                              "content": prompt,
                          },
                      ],
                      temperature=0,
                  )

                  return response.choices[0].message.content or ""

              raise RuntimeError(f"Unknown LLM model kind: {model_kind}")

          def run_pynguin(source_file: str) -> dict[str, Any]:
              start = time.monotonic()
              module_name = module_name_from_path(source_file)
              out_file = safe_test_path(source_file)

              with tempfile.TemporaryDirectory(prefix="lazytest_pynguin_") as tmp:
                  tmp_path = Path(tmp)

                  cmd = [
                      "pynguin",
                      "--project-path",
                      str(ROOT),
                      "--output-path",
                      str(tmp_path),
                      "--module-name",
                      module_name,
                      "--algorithm",
                      "DYNAMOSA",
                      "--maximum-search-time",
                      "60",
                      "--maximum-test-execution-timeout",
                      "5",
                      "-v",
                      *PYNGUIN_ARGS,
                  ]

                  print(f"Running Pynguin for {source_file}")
                  print("Command:", " ".join(cmd))

                  safe_env = os.environ.copy()
                  safe_env["PYNGUIN_DANGER_AWARE"] = "1"

                  # Pynguin imports and executes target code. API keys are not
                  # needed by Pynguin and should not be exposed to that subprocess.
                  for secret_key in (
                      "OPENAI_API_KEY",
                      "GEMINI_API_KEY",
                      "LOCAL_LLM_API_KEY",
                  ):
                      safe_env.pop(secret_key, None)

                  try:
                      completed = subprocess.run(
                          cmd,
                          cwd=ROOT,
                          text=True,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.STDOUT,
                          timeout=900,
                          env=safe_env,
                      )
                  except subprocess.TimeoutExpired:
                      elapsed = time.monotonic() - start
                      return {
                          "test_path": None,
                          "status": "timeout",
                          "syntax_valid": False,
                          "elapsed_s": elapsed,
                          "n_tests": 0,
                          "notes": "Pynguin timed out",
                      }

                  print(completed.stdout)

                  generated_files = sorted(
                      path
                      for path in tmp_path.rglob("*.py")
                      if path.name != "__init__.py"
                  )

                  if not generated_files:
                      elapsed = time.monotonic() - start
                      return {
                          "test_path": None,
                          "status": "failed",
                          "syntax_valid": False,
                          "elapsed_s": elapsed,
                          "n_tests": 0,
                          "notes": f"Pynguin produced no Python test files; exit code {completed.returncode}",
                      }

                  combined_parts = []

                  for generated in generated_files:
                      try:
                          combined_parts.append(generated.read_text(encoding="utf-8"))
                      except UnicodeDecodeError:
                          combined_parts.append(generated.read_text(errors="replace"))

                  code = "\n\n".join(combined_parts).strip() + "\n"
                  out_file.write_text(code, encoding="utf-8")

                  syntax_valid, syntax_note = compile_status(code, out_file)
                  elapsed = time.monotonic() - start

                  if completed.returncode == 0 and syntax_valid:
                      status = "ok"
                      notes = "Pynguin generated syntactically valid tests"
                  elif syntax_valid:
                      status = "partial"
                      notes = f"Pynguin returned exit code {completed.returncode}, but produced syntactically valid tests"
                  else:
                      status = "syntax_error"
                      notes = syntax_note

                  return {
                      "test_path": out_file,
                      "status": status,
                      "syntax_valid": syntax_valid,
                      "elapsed_s": elapsed,
                      "n_tests": count_tests(code),
                      "notes": notes,
                  }

          def run_direct_llm(source_file: str, model_kind: str) -> dict[str, Any]:
              start = time.monotonic()
              out_file = safe_test_path(source_file)

              source_code = Path(source_file).read_text(
                  encoding="utf-8",
                  errors="replace",
              )

              prompt = build_direct_generation_prompt(source_file, source_code)

              raw_text = call_llm(model_kind, prompt)
              code = clean_llm_output(raw_text)

              out_file.write_text(code, encoding="utf-8")

              syntax_valid, syntax_note = compile_status(code, out_file)
              elapsed = time.monotonic() - start
              n_tests = count_tests(code)

              if not code.strip():
                  status = "invalid_output"
                  notes = f"{model_kind} returned empty output"
              elif "def test_" not in code:
                  status = "invalid_output"
                  notes = f"{model_kind} output did not contain pytest test functions"
              elif syntax_valid:
                  status = "ok"
                  notes = f"Direct {model_kind} generation completed"
              else:
                  status = "syntax_error"
                  notes = syntax_note

              return {
                  "test_path": out_file,
                  "status": status,
                  "syntax_valid": syntax_valid,
                  "elapsed_s": elapsed,
                  "n_tests": n_tests,
                  "notes": notes,
              }

          def refine_pynguin_tests(
              *,
              source_file: str,
              test_path: Path,
              model_kind: str,
          ) -> dict[str, Any]:
              start = time.monotonic()

              source_code = Path(source_file).read_text(
                  encoding="utf-8",
                  errors="replace",
              )
              test_code = test_path.read_text(
                  encoding="utf-8",
                  errors="replace",
              )

              prompt = build_refinement_prompt(
                  source_file=source_file,
                  source_code=source_code,
                  test_file=rel(test_path),
                  test_code=test_code,
              )

              raw_text = call_llm(model_kind, prompt)
              refined_code = clean_llm_output(raw_text)

              syntax_valid, syntax_note = compile_status(refined_code, test_path)
              elapsed = time.monotonic() - start
              n_tests = count_tests(refined_code)

              if not refined_code.strip():
                  return {
                      "status": "refinement_failed",
                      "syntax_valid": False,
                      "elapsed_s": elapsed,
                      "n_tests": 0,
                      "notes": f"{model_kind} returned empty refinement output",
                  }

              if "def test_" not in refined_code:
                  return {
                      "status": "refinement_failed",
                      "syntax_valid": False,
                      "elapsed_s": elapsed,
                      "n_tests": n_tests,
                      "notes": f"{model_kind} refinement did not contain pytest test functions",
                  }

              if not syntax_valid:
                  return {
                      "status": "refinement_failed",
                      "syntax_valid": False,
                      "elapsed_s": elapsed,
                      "n_tests": n_tests,
                      "notes": syntax_note,
                  }

              test_path.write_text(refined_code, encoding="utf-8")

              return {
                  "status": "ok",
                  "syntax_valid": True,
                  "elapsed_s": elapsed,
                  "n_tests": n_tests,
                  "notes": f"Pynguin output refined with {model_kind}",
              }

          def process_source_file(source_file: str) -> None:
              source_path = ROOT / source_file

              if not source_path.exists():
                  record_result(
                      source_file=source_file,
                      test_file=None,
                      status="skipped",
                      syntax_valid=False,
                      elapsed_s=0,
                      notes="Source file does not exist",
                  )
                  return

              try:
                  if GENERATOR == "pynguin":
                      result = run_pynguin(source_file)

                      test_path = result["test_path"]
                      record_result(
                          source_file=source_file,
                          test_file=rel(test_path) if test_path else None,
                          status=result["status"],
                          syntax_valid=result["syntax_valid"],
                          elapsed_s=result["elapsed_s"],
                          n_tests=result["n_tests"],
                          notes=result["notes"],
                      )
                      return

                  if GENERATOR in DIRECT_LLM_MODES:
                      model_kind = DIRECT_LLM_MODES[GENERATOR]
                      result = run_direct_llm(source_file, model_kind)

                      test_path = result["test_path"]
                      record_result(
                          source_file=source_file,
                          test_file=rel(test_path) if test_path else None,
                          status=result["status"],
                          syntax_valid=result["syntax_valid"],
                          elapsed_s=result["elapsed_s"],
                          n_tests=result["n_tests"],
                          notes=result["notes"],
                      )
                      return

                  if GENERATOR in HYBRID_MODES:
                      model_kind = HYBRID_MODES[GENERATOR]

                      pynguin_result = run_pynguin(source_file)
                      test_path = pynguin_result["test_path"]

                      if not test_path:
                          record_result(
                              source_file=source_file,
                              test_file=None,
                              status=pynguin_result["status"],
                              syntax_valid=False,
                              elapsed_s=pynguin_result["elapsed_s"],
                              n_tests=0,
                              refinement_model=model_kind,
                              notes=f"Pynguin stage failed before refinement: {pynguin_result['notes']}",
                          )
                          return

                      refinement_result = refine_pynguin_tests(
                          source_file=source_file,
                          test_path=test_path,
                          model_kind=model_kind,
                      )

                      final_code = test_path.read_text(
                          encoding="utf-8",
                          errors="replace",
                      )

                      final_syntax_valid, final_syntax_note = compile_status(
                          final_code,
                          test_path,
                      )

                      if refinement_result["status"] == "ok":
                          final_status = "ok"
                          final_notes = (
                              f"Pynguin stage: {pynguin_result['status']} "
                              f"({pynguin_result['notes']}); "
                              f"refinement stage: {refinement_result['notes']}"
                          )
                      else:
                          final_status = (
                              pynguin_result["status"]
                              if pynguin_result["syntax_valid"]
                              else "refinement_failed"
                          )
                          final_notes = (
                              f"Pynguin stage: {pynguin_result['status']} "
                              f"({pynguin_result['notes']}); "
                              f"refinement failed: {refinement_result['notes']}"
                          )

                      if not final_syntax_valid:
                          final_notes = final_notes + f"; final syntax: {final_syntax_note}"

                      record_result(
                          source_file=source_file,
                          test_file=rel(test_path),
                          status=final_status,
                          syntax_valid=final_syntax_valid,
                          elapsed_s=pynguin_result["elapsed_s"] + refinement_result["elapsed_s"],
                          n_tests=count_tests(final_code),
                          refinement_model=model_kind,
                          notes=final_notes,
                      )
                      return

                  record_result(
                      source_file=source_file,
                      test_file=None,
                      status="error",
                      syntax_valid=False,
                      elapsed_s=0,
                      notes=f"Unknown generator mode: {GENERATOR}",
                  )

              except Exception as exc:
                  record_result(
                      source_file=source_file,
                      test_file=None,
                      status="error",
                      syntax_valid=False,
                      elapsed_s=0,
                      notes=f"{exc.__class__.__name__}: {exc}",
                  )
                  print(
                      f"ERROR while processing {source_file}: {exc}",
                      file=sys.stderr,
                  )

          for source_file in changed_files:
              process_source_file(source_file)

          manifest_path = ROOT / "lazytest_manifest.json"
          manifest_path.write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8",
          )

          csv_path = ROOT / "lazytest_results.csv"

          fieldnames = [
              "source_file",
              "test_file",
              "status",
              "syntax_valid",
              "elapsed_s",
              "n_tests",
              "refinement_model",
              "notes",
          ]

          with csv_path.open("w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()

              for result in manifest["results"]:
                  writer.writerow(
                      {field: result.get(field, "") for field in fieldnames}
                  )

          generated_count = 0
          successful_count = 0
          test_containing_count = 0

          for result in manifest["results"]:
              test_file = result.get("test_file")

              if test_file and Path(test_file).exists():
                  generated_count += 1

              if test_file and result.get("syntax_valid") is True:
                  successful_count += 1

              if (
                  test_file
                  and Path(test_file).exists()
                  and result.get("syntax_valid") is True
                  and int(result.get("n_tests", 0) or 0) > 0
              ):
                  test_containing_count += 1

          print(json.dumps(manifest, indent=2))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"generated_count={generated_count}\n")
              f.write(f"successful_count={successful_count}\n")
              f.write(f"test_containing_count={test_containing_count}\n")
          PY

      - name: Run generated tests and collect coverage
        id: run_tests
        if: steps.generate.outputs.generated_count != '0'
        continue-on-error: true
        timeout-minutes: 20
        shell: bash
        run: |
          set +e

          export PYTHONPATH="$PYTHONPATH:."

          rm -f .coverage .coverage.* coverage.json result.log failure.log .coveragerc.lazytest

          cat > .coveragerc.lazytest <<'EOF'
          [run]
          branch = True
          source = .
          omit =
              tests/*
              */tests/*
              */testing/*
              */test_*.py
              */*_test.py
              */conftest.py

          [report]
          skip_empty = True
          EOF

          python -m coverage erase 2>/dev/null || true

          pytest tests/generated/ \
            -v \
            --tb=short \
            --timeout=15 \
            --timeout-method=thread \
            --cov=. \
            --cov-config=.coveragerc.lazytest \
            --cov-report=json:coverage.json \
            --cov-report=term-missing:skip-covered \
            | tee result.log

          PYTEST_EXIT=${PIPESTATUS[0]}

          if [ "$PYTEST_EXIT" -ne 0 ]; then
            cp result.log failure.log
          else
            echo "No pytest failures." > failure.log
          fi

          SUMMARY="$(
            grep -E '=+ .* (passed|failed|error|errors|skipped|xfailed|xpassed).* =+' result.log \
              | tail -1 \
              | sed 's/^=*\s*//; s/\s*=*$//' \
              || true
          )"

          if [ -z "$SUMMARY" ]; then
            SUMMARY="pytest exited with code $PYTEST_EXIT"
          fi

          if [ "$PYTEST_EXIT" -eq 0 ]; then
            STATUS="All Passed"
            PASSED="true"
          else
            STATUS="Issues Found"
            PASSED="false"
          fi

          echo "test_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "test_passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "test_exit_code=$PYTEST_EXIT" >> "$GITHUB_OUTPUT"
          echo "test_summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          echo "coverage_json=coverage.json" >> "$GITHUB_OUTPUT"

          echo "Status: $STATUS"
          echo "Summary: $SUMMARY"

          set -e

      - name: Upload LazyTest artifacts
        if: always() && steps.changed_files.outputs.has_changed_files == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lazytest-results-pr-${{ github.event.issue.number }}-${{ needs.parse-command.outputs.generator }}
          path: |
            tests/generated/
            lazytest_manifest.json
            lazytest_results.csv
            evaluation_manifest.csv
            evaluation_manifest.json
            run_metadata.json
            result.log
            failure.log
            coverage.json
            .coveragerc.lazytest
            changed_files.txt
            changed_candidates.txt
          if-no-files-found: ignore

  report-and-writeback:
    needs:
      - parse-command
      - preflight
      - generate-tests

    if: ${{ always() && needs.preflight.outputs.can_run == 'true' }}

    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: read

    steps:
      - name: Checkout verified PR head for optional writeback
        if: >
          needs.generate-tests.result == 'success' &&
          needs.generate-tests.outputs.has_changed_files == 'true' &&
          needs.generate-tests.outputs.generated_count != '0' &&
          needs.parse-command.outputs.commit_mode != 'none' &&
          (
            needs.parse-command.outputs.commit_mode == 'all' ||
            needs.generate-tests.outputs.test_passed == 'true'
          )
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ needs.preflight.outputs.head_repo }}
          ref: ${{ needs.preflight.outputs.head_sha }}
          fetch-depth: 0

      - name: Download validated result artifact
        if: >
          needs.generate-tests.result == 'success' &&
          needs.generate-tests.outputs.has_changed_files == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lazytest-results-pr-${{ github.event.issue.number }}-${{ needs.parse-command.outputs.generator }}
          path: .

      - name: Commit generated tests to unchanged PR head
        id: writeback
        continue-on-error: true
        if: >
          needs.generate-tests.result == 'success' &&
          needs.generate-tests.outputs.has_changed_files == 'true' &&
          needs.generate-tests.outputs.generated_count != '0' &&
          needs.parse-command.outputs.commit_mode != 'none' &&
          (
            needs.parse-command.outputs.commit_mode == 'all' ||
            needs.generate-tests.outputs.test_passed == 'true'
          )
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          HEAD_REF: ${{ needs.preflight.outputs.head_ref }}
          GENERATOR: ${{ needs.parse-command.outputs.generator }}
        run: |
          set -euo pipefail

          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk '{print $1}')"
          if [ "$REMOTE_HEAD" != "$EXPECTED_HEAD_SHA" ]; then
            echo "::error::PR head changed after validation; refusing writeback."
            exit 1
          fi

          git checkout -B "$HEAD_REF" "$EXPECTED_HEAD_SHA"
          git add -- tests/generated/
          for result_file in \
            lazytest_manifest.json \
            lazytest_results.csv \
            evaluation_manifest.csv \
            evaluation_manifest.json \
            run_metadata.json \
            coverage.json
          do
            if [ -f "$result_file" ]; then
              git add -- "$result_file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: LazyTest generated tests ($GENERATOR)"
          git push origin "HEAD:refs/heads/$HEAD_REF"

      - name: Report results
        if: always() && needs.generate-tests.outputs.has_changed_files == 'true'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### LazyTest Generation Report

            **Command:** `@lazytest-gen`  
            **Event:** `issue_comment` on `pull_request`  
            **Author association:** `${{ github.event.comment.author_association }}`  

            **Generator:** `${{ needs.parse-command.outputs.generator }}`  
            **Runner:** `${{ needs.parse-command.outputs.runner }}`  
            **Commit mode:** `${{ needs.parse-command.outputs.commit_mode }}`  
            **Writeback step:** `${{ steps.writeback.outcome || 'not requested' }}`

            **Refinement enabled:** `${{ needs.parse-command.outputs.refinement_enabled }}`  
            **Refinement model:** `${{ needs.parse-command.outputs.refinement_model }}`  

            **Generated test files:** `${{ needs.generate-tests.outputs.generated_count }}`
            **Syntactically valid generated files:** `${{ needs.generate-tests.outputs.successful_count }}`
            **Generated files containing pytest tests:** `${{ needs.generate-tests.outputs.test_containing_count }}`

            **Pytest status:** `${{ needs.generate-tests.outputs.test_status || 'Not run' }}`
            **Pytest summary:** `${{ needs.generate-tests.outputs.test_summary || 'No pytest summary available' }}`
            **Pytest exit code:** `${{ needs.generate-tests.outputs.test_exit_code || 'N/A' }}`

            **Coverage artifact:** `coverage.json`  
            **Failure log:** `failure.log`  
            **Run metadata:** `run_metadata.json`  
            **Evaluation manifest:** `evaluation_manifest.csv` / `evaluation_manifest.json`  

            **Parse warning:** `${{ needs.parse-command.outputs.parse_warning }}`  
            **Generator fallback warning:** `${{ needs.parse-command.outputs.fallback_warning }}`  
            **Ignored command arguments:** `${{ needs.parse-command.outputs.ignored_args_json }}`

            **Target files:**
            ```text
            ${{ needs.generate-tests.outputs.all_changed_files }}
            ```

            Generated tests, logs, coverage data, run metadata, and metric files were uploaded as workflow artifacts. Where the selected commit mode allowed it, the guarded writeback job also committed generated tests and metadata to the unchanged PR head.

      - name: Report no changed Python files
        if: always() && needs.generate-tests.outputs.has_changed_files == 'false'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### LazyTest Generation Report

            **Command:** `@lazytest-gen`  
            **Event:** `issue_comment` on `pull_request`  
            **Generator:** `${{ needs.parse-command.outputs.generator }}`  

            No changed non-test Python files were detected, so no tests were generated.

            This can happen when the pull request changes only documentation, configuration files, existing tests, `conftest.py`, `test_*.py`, or `*_test.py` files.

      - name: Report validation job failure
        if: always() && needs.generate-tests.result != 'success'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### LazyTest Generation Report

            The trusted validation job did not complete successfully. No writeback was attempted. Inspect the workflow logs for the failure details.
