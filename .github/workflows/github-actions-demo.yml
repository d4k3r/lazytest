name: Pynguin Test Generator (Full AI)

on:
  issue_comment:
    types: [created]

jobs:
  generate-tests:
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@pynguin-test-gen')

    runs-on: ubuntu-latest

    # Права нужны для коммита кода и отправки комментария
    permissions:
      pull-requests: write
      contents: write
      issues: write

    steps:
      # 1. Реакция на комментарий (визуальный фидбек)
      - name: Add reaction
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: 'rocket'

      # 2. Получение информации о ветках через API (так как issue_comment этого не знает)
      - name: Get PR details
        id: pr_data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName,baseRefName,headRepositoryOwner)
          echo "head_ref=$(echo "$json" | jq -r .headRefName)" >> $GITHUB_OUTPUT
          echo "base_ref=$(echo "$json" | jq -r .baseRefName)" >> $GITHUB_OUTPUT
          echo "head_owner=$(echo "$json" | jq -r .headRepositoryOwner.login)" >> $GITHUB_OUTPUT

      - name: Parse arguments
        id: get_args
        shell: python
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          import os, re, shlex

          comment = os.environ.get("COMMENT_BODY", "")
          match = re.search(r'@pynguin-test-gen\s+(.*)', comment, re.IGNORECASE)
          raw = match.group(1).strip() if match else ""

          # Разбиваем корректно (учтёт кавычки)
          try:
              tokens = shlex.split(raw)
          except Exception:
              tokens = raw.split()

          generator = None
          new_tokens = []
          i = 0

          while i < len(tokens):
              t = tokens[i]

              # form: --generator value
              if t == "--generator":
                  if i + 1 < len(tokens):
                      generator = tokens[i + 1].lower()
                      i += 2
                      continue
                  else:
                      i += 1
                      continue

              # form: --generator=val
              if t.startswith("--generator="):
                  generator = t.split("=", 1)[1].lower()
                  i += 1
                  continue

              # otherwise - leave as a common argument
              new_tokens.append(t)
              i += 1

          # whitelist of generators
          allowed = {"pynguin", "chatgpt", "gemini", "claude"}

          if generator:
              generator = generator.lower()
              if generator not in allowed:
                  print(f"⚠️ Unknown generator '{generator}' — falling back to 'pynguin'")
                  generator = "pynguin"
          else:
              generator = "pynguin"

          # args: строка и shell-квотированная версия для безопасного восстановления
          args = " ".join(new_tokens)
          args_quoted = " ".join(shlex.quote(x) for x in new_tokens)

          out = os.environ.get("GITHUB_OUTPUT")
          if out:
              with open(out, "a") as f:
                  f.write(f"args={args}\n")
                  f.write(f"args_quoted={args_quoted}\n")
                  f.write(f"generator={generator}\n")   # <-- имя output: generator
          else:
              print("GITHUB_OUTPUT not found")



      # 4. Checkout кода
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr_data.outputs.head_owner }}/${{ github.event.repository.name }}
          ref: ${{ steps.pr_data.outputs.head_ref }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ steps.pr_data.outputs.base_ref }}:${{ steps.pr_data.outputs.base_ref }}

      # 5. Установка зависимостей (включая AI библиотеки)
      - name: Set up Python & Install
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # TODO: install dependencies based only on user's choice of generator
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pynguin pytest google-generativeai openai

      # 6. Поиск измененных файлов (исключая папку tests)
      - name: Identify changed files
        id: changed-files
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ steps.pr_data.outputs.base_ref }} HEAD -- '*.py' | grep -v "tests/")
          
          # Если изменений нет, выходим рано, но не ломаем пайплайн
          if [ -z "$CHANGED_FILES" ]; then
            echo "No .py files changed."
            echo "all_changed_files=" >> $GITHUB_OUTPUT
          else
            echo "Detected: $CHANGED_FILES"
            # Многострочная запись в output
            echo "all_changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # 7. ГЕНЕРАЦИЯ ТЕСТОВ (Pynguin)
      - name: Generate tests with Pynguin
        timeout-minutes: 3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYNGUIN_DANGER_AWARE: "1"
        run: |
          GENERATOR="${{ steps.get_args.outputs.generator }}"
          ARGS_QUOTED="${{ steps.get_args.outputs.args_quoted }}"
          CHANGED="${{ steps.changed-files.outputs.all_changed_files }}"
          # Normalise CRLF
          CHANGED="${CHANGED//$'\r'/}"
          
          if [ -z "$CHANGED" ]; then
            echo "No changed files -> skip generation"
            exit 0
          fi
          mkdir -p tests/generated

          # Восстанавливаем массив аргументов (безопасно, т.к. args_quoted строится через shlex.quote)
          USER_ARGS_ARRAY=()
          if [ -n "$ARGS_QUOTED" ]; then
            eval "USER_ARGS_ARRAY=($ARGS_QUOTED)"
          fi

          echo "Generator: $GENERATOR"
          echo "Extra args: ${USER_ARGS_ARRAY[*]}"

          # Используем here-string, чтобы корректно читать строки с пробелами
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ ! -f "$file" ]; then
              echo "Skip (not a file): $file"
              continue
            fi

            module_name=$(echo "$file" | sed 's/\.py$//' | tr '/' '.')
            
            case "$GENERATOR" in
              pynguin)
                # Удаляем старые тесты перед генерацией
                find tests/generated -name "test_*${module_name##*.}.py" -delete

                echo "Generating for $module_name with args: ${USER_ARGS_ARRAY[*]}"
                pynguin \
                  --project-path . \
                  --output-path tests/generated \
                  --module-name "$module_name" \
                  --algorithm DYNAMOSA \
                  --maximum-search-time 60 \
                  --maximum-test-execution-timeout 5 \
                  -v \
                  "${USER_ARGS_ARRAY[@]}"
                ;;
          
          
          
                chatgpt)
                  echo "ChatGPT generator"
  
                  export SRC_FILE="$file"
  
                  # Обратите внимание: добавлен дефис (-) после python для явного чтения из stdin
                  python - <<'PY'
          import os
          from openai import OpenAI
          
          client = OpenAI(api_key=os.environ["OPENAI_API_KEY"])
          
          src = os.environ["SRC_FILE"]
          with open(src, "r", encoding="utf-8") as f:
              code = f.read()
          
          prompt = f"""
          You are given a Python source file.
          
          {code}
          
          Write ONLY pytest tests for the functions in this file.
          Do NOT reimplement any functions.
          Do NOT write explanations.
          Output ONLY valid Python code.
          """
          
          resp = client.chat.completions.create(
              model="gpt-4o-mini",
              messages=[
                  {"role": "system", "content": "You generate only valid pytest code."},
                  {"role": "user", "content": prompt},
              ],
              temperature=0,
          )
          
          text = resp.choices[0].message.content
          text = text.replace("```python", "").replace("```", "").strip()
          
          base = os.path.basename(src).replace(".py", "")
          out = f"tests/generated/test_{base}.py"
          
          with open(out, "w", encoding="utf-8") as f:
              f.write(text + "\n")
          
          print(f"Written {out}")
          PY
                ;;

              

          
          
          
              gemini)
                echo "Gemini generator"
                
                export SRC_FILE="$file"
                
                python - <<'PY'
                import os, sys
                import google.generativeai as genai
                
                genai.configure(api_key=os.environ["GEMINI_API_KEY"])
                
                src = os.environ["SRC_FILE"]
                with open(src, "r", encoding="utf-8") as f:
                    code = f.read()
                
                prompt = f"""
                You are given a Python source file.
                
                {code}
                
                Write ONLY pytest tests for the functions in this file.
                Do NOT reimplement any functions.
                Do NOT write explanations.
                Output ONLY valid Python code.
                """
                
                model = genai.GenerativeModel("gemini-2.5-flash")
                
                resp = model.generate_content(prompt)
                
                text = resp.text
                text = text.replace("```python", "").replace("```", "").strip()
                
                base = os.path.basename(src).replace(".py", "")
                out = f"tests/generated/test_{base}.py"
                
                with open(out, "w", encoding="utf-8") as f:
                    f.write(text + "\n")
                
                print("Written", out)
                PY
              ;;

          
          
          
              claude)
                echo "Claude generator"
                ;;
              *)
                echo "Unknown generator: $GENERATOR — falling back to pynguin"
                # fallback на pynguin (альтернатива: exit 1)
                pynguin \
                  --project-path . \
                  --output-path tests/generated \
                  --module-name "$module_name" \
                  --algorithm DYNAMOSA \
                  --maximum-search-time 60 \
                  --maximum-test-execution-timeout 5 \
                  -v \
                  "${USER_ARGS_ARRAY[@]}"
                ;;
            esac

          done <<< "$CHANGED"


